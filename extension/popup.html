<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    width: 320px; margin: 0; padding: 14px;
    font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
  }
  h1 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  label { display: block; margin-bottom: 4px; color: #666; font-size: 12px; }
  @media (prefers-color-scheme: dark) { label { color: #aaa; } }
  input, select {
    width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 10px;
    border: 1px solid #ccc; border-radius: 6px; font: inherit; background: Field; color: FieldText;
  }
  button {
    width: 100%; padding: 9px; border: 0; border-radius: 6px;
    font: inherit; font-weight: 600; color: #fff; background: #1a73e8; cursor: pointer;
  }
  button.rec { background: #d93025; }
  button:disabled { opacity: .6; cursor: default; }
  #timer { margin: 10px 0 0; font-size: 22px; font-weight: 600; text-align: center; letter-spacing: 1px; }
  #where { margin: 6px 0 0; text-align: center; color: #666; font-size: 12px; }
  #status { margin: 10px 0 0; padding: 8px; border-radius: 6px; background: rgba(127,127,127,.12); font-size: 12px; }
  #status.bad { background: rgba(217, 48, 37, .15); }
  #pair { margin: 0 0 10px; padding: 8px 10px; border-radius: 6px;
          background: rgba(26, 115, 232, .12); font-size: 12px; }
  #pair b { display: block; font-size: 13px; margin-bottom: 2px; }
  .hidden { display: none; }
  #settings { margin-top: 10px; font-size: 12px; }
  #settings summary { cursor: pointer; color: #666; }
  #settings input { margin-top: 6px; }
</style>
</head>
<body>
  <h1>Запись пары</h1>

  <p id="pair" class="hidden"></p>

  <div id="idle">
    <label for="subject">Предмет</label>
    <input id="subject" placeholder="Например, Матанализ" autocomplete="off">
    <label for="tab">Вкладка</label>
    <select id="tab"></select>
  </div>

  <div id="active" class="hidden">
    <p id="timer">00:00:00</p>
    <p id="where"></p>
  </div>

  <button id="go">Начать запись</button>
  <p id="status"></p>

  <details id="settings">
    <summary>Настройки</summary>
    <label for="port">Порт агента (python agent.py serve)</label>
    <input id="port" type="number" min="1" max="65535">
  </details>

  <script src="popup.js"></script>
</body>
</html>
