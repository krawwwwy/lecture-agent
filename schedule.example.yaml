# Пример расписания. Скопируйте этот файл в schedule.yaml и впишите свои пары.
# Настоящий schedule.yaml в репозиторий не попадает: в нём ссылки на занятия,
# а у некоторых пароль прямо в адресе.
#
# Как читать поле when:
#   "14.09-19.10 к.н."   каждую неделю с 14.09 по 19.10
#   "27.10-24.11 ч.н."   через неделю (каждая вторая)
#   "14.10, 28.10"       только эти даты
#   можно перечислять через запятую: "09.09-30.09 к.н., 11.11-02.12 к.н."
#
# Даты пишутся в том же виде, что и в расписании вуза, без года: год берётся
# из поля year ниже. Агент проверяет, что дата попадает на указанный день
# недели, и не запускается, если где-то опечатка.
#
# remote: true   дистанционно, запись идёт через расширение для браузера
# remote: false  очно, агент пишет микрофоном сам
#
# time всегда в кавычках. Без них YAML читает 10:45 как число, а не как время.

group: ГРУППА-00-00
subgroup: А           # своя подгруппа: пары чужой агент пропустит
timezone: Europe/Moscow
year: 2026            # год, в котором семестр начался

pairs:
  # Обычная еженедельная пара с ссылкой на онлайн-занятие.
  - subject: Базы, банки и анализ данных
    kind: Лекция
    teacher: Иванов И.И.
    day: пн
    time: "18:00-19:30"
    when: "07.09-23.11 к.н."
    remote: true
    link: "https://example.com/j/0000000000"

  # Очная пара: link не нужен, зато полезно записать аудиторию.
  - subject: Нейронные сети и нечёткая логика
    kind: Лекция
    teacher: Петров П.П.
    day: вт
    time: "18:00-19:30"
    room: "0207"
    when: "08.09-27.10 к.н."
    remote: false

  # Пара через неделю: ч.н. вместо к.н.
  - subject: Методология научных исследований
    kind: Семинар
    teacher: Сидорова А.В.
    day: ср
    time: "19:40-21:10"
    when: "09.09-02.12 ч.н."
    remote: true
    link: "https://example.com/j/1111111111"

  # Занятие у второй подгруппы: агент возьмёт его, только если subgroup вверху Б.
  - subject: Проектирование интерфейсов оператора
    kind: Лабораторная
    teacher: Кузнецов Н.С.
    subgroup: Б
    day: чт
    time: "19:40-22:50"
    when: "10.09, 24.09, 08.10"
    remote: true
    link: "https://example.com/j/2222222222"

  # Ссылки может не быть вовсе: преподаватель присылает её каждый раз заново.
  - subject: Промышленная и мобильная робототехника
    kind: Лекция
    teacher: Смирнов Д.А.
    day: пт
    time: "18:00-19:30"
    when: "11.09-11.12 к.н."
    remote: true

  # Два периода в одном поле when.
  - subject: Математическое моделирование
    kind: Семинар
    teacher: Иванов И.И.
    day: сб
    time: "12:20-13:55"
    when: "12.09-03.10 к.н., 14.11-05.12 к.н."
    remote: true
    link: "https://example.com/j/3333333333"
